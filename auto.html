<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Миграция Niko Feed</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 24px; border-radius: 12px; width: 340px; text-align: center; }
        button { background: #3b82f6; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
        button:hover { background: #2563eb; }
        .stop { background: #ef4444; }
        .stop:hover { background: #dc2626; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
        #log { margin-top: 10px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛠 Миграция базы</h2>
        <div id="log">Нажмите «Старт»</div>
        <div id="status">Готов к запуску</div>
        <button id="btn" onclick="toggle()">🚀 Запустить автопилот</button>
    </div>

    <script>
        let isRunning = false;

        async function toggle() {
            isRunning = !isRunning;
            const btn = document.getElementById('btn');
            if (isRunning) {
                btn.textContent = '⏹ Остановить';
                btn.className = 'stop';
                loop();
            } else {
                btn.textContent = '🚀 Запустить автопилот';
                btn.className = '';
                document.getElementById('status').textContent = 'Приостановлено пользователем';
            }
        }

        async function loop() {
            while (isRunning) {
                try {
                    document.getElementById('status').textContent = '⏳ Обработка пачки 5 видео...';
                    const res = await fetch('/api/migrate');
                    const data = await res.json();

                    if (!data.ok) throw new Error(data.error || 'Ошибка');

                    document.getElementById('log').innerHTML = `Осталось: <b>${data.remaining}</b> из ${data.total}`;
                    document.getElementById('status').textContent = `Перенесено: +${data.processed}, Ошибок: ${data.failed}`;

                    if (data.remaining === 0) {
                        isRunning = false;
                        document.getElementById('log').textContent = '🎉 ВСЁ ГОТОВО!';
                        document.getElementById('btn').style.display = 'none';
                        break;
                    }
                } catch (e) {
                    document.getElementById('status').textContent = '⚠️ Ошибка: ' + e.message + ', повторяю через 3 сек...';
                }
                await new Promise(r => setTimeout(r, 2500));
            }
        }
    </script>
</body>
</html>
